name: Deploy Pair Application

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

# Single source of truth for the legacy-domain 301 window. Both deploy jobs read
# this; deploy-azure.sh removes the redirect once the date has passed.
env:
  LEGACY_REDIRECT_UNTIL: "2026-08-28"

jobs:

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt

      - name: Run API tests
        # Env stubs live in apps/api/tests/conftest.py (single source of truth).
        # No --ignore: the whole suite runs, so a file cannot regress unnoticed
        # behind an exclusion that outlives the failures it was added for.
        run: |
          cd apps/api
          pytest -q

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run web unit tests
        working-directory: apps/web
        run: |
          npm ci --legacy-peer-deps
          npm run build
          node --experimental-strip-types --test lib/activityTimeline.test.ts lib/candidateVisibility.test.ts lib/launch-rules.test.ts lib/launch-session.test.ts lib/nr-config.test.ts lib/newrelic.test.ts lib/analytics-props.test.ts lib/fetch-auth.test.ts

  # ----------------------
  # QA DEPLOYMENT
  # ----------------------
  deploy-qa:
    needs: test-api
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    # One deploy at a time per VM. Two develop merges seconds apart used to
    # SSH in together, and one died on `git fetch --all` ("cannot lock ref")
    # while the other rebuilt (2026-09-25, #705 + #703). A running deploy is
    # never cancelled; a newer one waits. GitHub keeps one waiting run per
    # group and cancels older waiting ones, which is safe here: the VM resets
    # to origin/develop, so the newest run ships everything merged so far.
    concurrency:
      group: deploy-qa
      cancel-in-progress: false

    environment:
      name: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_JOB_DIVA_KEY_QA }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.AZURE_JOB_DIVA_HOST_QA }} >> ~/.ssh/known_hosts

      - name: Deploy to QA VM
        env:
          DOMAIN_NAME: pairqa.pyramidci.com
          # Transition window: keep the retired hostname answering with a 301
          # to the new one. Removed automatically by deploy-azure.sh after the
          # date below - delete these two vars once it lapses.
          LEGACY_DOMAIN: qacurate.hoonr.ai
          # Contact enrichment key; deploy-azure.sh writes it to apps/api/.env when set.
          KIPPLO_API_KEY: ${{ secrets.KIPPLO_API_KEY }}
          # New Relic APM (docs/observability/new-relic.md). deploy-azure.sh writes
          # each into apps/api/.env only when non-empty, so an unset secret leaves
          # a key added to .env by hand alone. Never echoed.
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APP_NAME: "PAIR API (QA)"
          NEW_RELIC_ENVIRONMENT: qa
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.AZURE_JOB_DIVA_HOST_QA }} << EOF
            set -e
            cd ~/codebase/airecruiter
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            export DOMAIN_NAME="$DOMAIN_NAME"
            export LEGACY_DOMAIN="$LEGACY_DOMAIN"
            export LEGACY_REDIRECT_UNTIL="$LEGACY_REDIRECT_UNTIL"
            export KIPPLO_API_KEY="$KIPPLO_API_KEY"
            export NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY"
            export NEW_RELIC_APP_NAME="$NEW_RELIC_APP_NAME"
            export NEW_RELIC_ENVIRONMENT="$NEW_RELIC_ENVIRONMENT"
            # The health check is the last link of the chain, so the job goes red
            # when the API is unhealthy after setup-ssl.sh (and still goes red,
            # as before, when deploy-azure.sh or setup-ssl.sh fails).
            bash deploy-azure.sh && export DOMAIN_NAME="$DOMAIN_NAME" && bash setup-ssl.sh \
              && curl -fsS --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors -o /dev/null http://localhost:8000/api/health
          EOF

      - name: New Relic deployment marker
        # Best effort: never fails the deploy. Skipped when NEW_RELIC_API_KEY
        # (a User key) is unset or the APM entity does not exist yet (first deploy).
        continue-on-error: true
        timeout-minutes: 2
        env:
          NR_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NR_ENTITY_NAME: "PAIR API (QA)"
          NR_USER: ${{ github.actor }}
          NR_VERSION: ${{ github.sha }}
        run: |
          # Key checked here, never in `if:` (secrets are not allowed there and
          # the workflow would fail to parse). Never set -x / curl -v.
          [ -n "$NR_API_KEY" ] || { echo "NEW_RELIC_API_KEY unset; skipping deployment marker"; exit 0; }
          command -v jq >/dev/null || { echo "jq not installed; skipping deployment marker"; exit 0; }
          nerdgraph() {
            curl -sS --max-time 20 https://api.newrelic.com/graphql \
              -H "Content-Type: application/json" -H "API-Key: $NR_API_KEY" --data "$1"
          }
          search=$(jq -n --arg q "name = '$NR_ENTITY_NAME' AND domain = 'APM' AND type = 'APPLICATION'" \
            '{query: "query($q: String!) { actor { entitySearch(query: $q) { results { entities { guid name } } } } }", variables: {q: $q}}')
          guid=$(nerdgraph "$search" | jq -r --arg n "$NR_ENTITY_NAME" \
            '[.data.actor.entitySearch.results.entities[]? | select(.name == $n) | .guid][0] // empty' || true)
          [ -n "$guid" ] || { echo "No APM entity named '$NR_ENTITY_NAME' yet; skipping deployment marker"; exit 0; }
          mutation=$(jq -n --arg guid "$guid" --arg version "${NR_VERSION:0:7}" --arg commit "$NR_VERSION" --arg user "$NR_USER" \
            '{query: "mutation($guid: EntityGuid!, $version: String!, $commit: String, $user: String) { changeTrackingCreateDeployment(deployment: {entityGuid: $guid, version: $version, commit: $commit, user: $user, deploymentType: BASIC}) { deploymentId } }", variables: {guid: $guid, version: $version, commit: $commit, user: $user}}')
          nerdgraph "$mutation" | jq -c '{deploymentId: .data.changeTrackingCreateDeployment.deploymentId, errors: [.errors[]?.message]}' || true

      - name: Deployment Info
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "🚀 QA Deployment Complete"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.event.head_commit.author.name }}"
          echo "💬 Message: $COMMIT_MSG"



  # ----------------------
  # PRODUCTION DEPLOYMENT
  # ----------------------
  deploy-prod:
    needs: test-api
    if: github.ref_name == 'main'
    #if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Same rule as deploy-qa, for the PROD VM.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_JOB_DIVA_KEY_PROD }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.AZURE_JOB_DIVA_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: Deploy to PROD VM
        env:
          DOMAIN_NAME: pair.pyramidci.com
          # Transition window: keep the retired hostname answering with a 301
          # to the new one. Removed automatically by deploy-azure.sh after the
          # date below - delete these two vars once it lapses.
          LEGACY_DOMAIN: curate.hoonr.ai
          # Contact enrichment key; deploy-azure.sh writes it to apps/api/.env when set.
          KIPPLO_API_KEY: ${{ secrets.KIPPLO_API_KEY }}
          # New Relic APM. Rollout: leave the production secret unset until QA
          # has run 48 h and the ingest change is measured (runbook).
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APP_NAME: "PAIR API (PROD)"
          NEW_RELIC_ENVIRONMENT: prod
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.AZURE_JOB_DIVA_HOST_PROD }} << EOF
            set -e
            cd ~/codebase/airecruiter
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            export DOMAIN_NAME="$DOMAIN_NAME"
            export LEGACY_DOMAIN="$LEGACY_DOMAIN"
            export LEGACY_REDIRECT_UNTIL="$LEGACY_REDIRECT_UNTIL"
            export KIPPLO_API_KEY="$KIPPLO_API_KEY"
            export NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY"
            export NEW_RELIC_APP_NAME="$NEW_RELIC_APP_NAME"
            export NEW_RELIC_ENVIRONMENT="$NEW_RELIC_ENVIRONMENT"
            # The health check is the last link of the chain, so the job goes red
            # when the API is unhealthy after setup-ssl.sh (and still goes red,
            # as before, when deploy-azure.sh or setup-ssl.sh fails).
            bash deploy-azure.sh && export DOMAIN_NAME="$DOMAIN_NAME" && bash setup-ssl.sh \
              && curl -fsS --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors -o /dev/null http://localhost:8000/api/health
          EOF

      - name: New Relic deployment marker
        continue-on-error: true
        timeout-minutes: 2
        env:
          NR_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NR_ENTITY_NAME: "PAIR API (PROD)"
          NR_USER: ${{ github.actor }}
          NR_VERSION: ${{ github.sha }}
        run: |
          # Key checked here, never in `if:` (secrets are not allowed there and
          # the workflow would fail to parse). Never set -x / curl -v.
          [ -n "$NR_API_KEY" ] || { echo "NEW_RELIC_API_KEY unset; skipping deployment marker"; exit 0; }
          command -v jq >/dev/null || { echo "jq not installed; skipping deployment marker"; exit 0; }
          nerdgraph() {
            curl -sS --max-time 20 https://api.newrelic.com/graphql \
              -H "Content-Type: application/json" -H "API-Key: $NR_API_KEY" --data "$1"
          }
          search=$(jq -n --arg q "name = '$NR_ENTITY_NAME' AND domain = 'APM' AND type = 'APPLICATION'" \
            '{query: "query($q: String!) { actor { entitySearch(query: $q) { results { entities { guid name } } } } }", variables: {q: $q}}')
          guid=$(nerdgraph "$search" | jq -r --arg n "$NR_ENTITY_NAME" \
            '[.data.actor.entitySearch.results.entities[]? | select(.name == $n) | .guid][0] // empty' || true)
          [ -n "$guid" ] || { echo "No APM entity named '$NR_ENTITY_NAME' yet; skipping deployment marker"; exit 0; }
          mutation=$(jq -n --arg guid "$guid" --arg version "${NR_VERSION:0:7}" --arg commit "$NR_VERSION" --arg user "$NR_USER" \
            '{query: "mutation($guid: EntityGuid!, $version: String!, $commit: String, $user: String) { changeTrackingCreateDeployment(deployment: {entityGuid: $guid, version: $version, commit: $commit, user: $user, deploymentType: BASIC}) { deploymentId } }", variables: {guid: $guid, version: $version, commit: $commit, user: $user}}')
          nerdgraph "$mutation" | jq -c '{deploymentId: .data.changeTrackingCreateDeployment.deploymentId, errors: [.errors[]?.message]}' || true

      - name: Deployment Info
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "🚀 PRODUCTION Deployment Complete"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.event.head_commit.author.name }}"
          echo "💬 Message: $COMMIT_MSG"
