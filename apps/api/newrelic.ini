# New Relic Python Agent Configuration
# https://docs.newrelic.com/docs/apm/agents/python-agent/configuration/python-agent-configuration/

[newrelic]

# License key and app name can be overridden via NEW_RELIC_LICENSE_KEY and NEW_RELIC_APP_NAME env vars
app_name = hoonr-api

# Set to false to disable the agent entirely
monitor_mode = true

# Log level for the agent's own diagnostics (critical, error, warning, info, debug)
log_level = info

# Enable SSL for data transmission to New Relic
ssl = true

# Transaction tracer — captures slow transactions and SQL
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
transaction_tracer.explain_enabled = true
transaction_tracer.explain_threshold = 0.5

# Error collector
error_collector.enabled = true
error_collector.capture_events = true

# Application logging forwarding to New Relic Logs
application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.metrics.enabled = true
application_logging.local_decorating.enabled = false

# Distributed tracing
distributed_tracing.enabled = true
