# New Relic Python Agent Configuration
# https://docs.newrelic.com/docs/apm/agents/python-agent/configuration/python-agent-configuration/
# Runbook: docs/observability/new-relic.md
#
# env-only (ini overrides env): app_name, labels, log_level, log_file and
# monitor_mode are deliberately NOT set here. The agent applies this file after
# its NEW_RELIC_* environment defaults, so any of them set here would silently
# win: QA and PROD would report as one app and the kill switch would stop
# working. core/newrelic.py sets the defaults before importing the agent:
#   NEW_RELIC_APP_NAME   "PAIR API (QA)" / "PAIR API (PROD)" / "PAIR API (local)"
#   NEW_RELIC_LABELS     env:<env>;service:pair-api
#   NEW_RELIC_LOG        stderr (agent diagnostics -> journald)
#   NEW_RELIC_LOG_LEVEL  warning
# The licence key comes from NEW_RELIC_LICENSE_KEY. NEW_RELIC_ENVIRONMENT also
# selects a [newrelic:<env>] section of this file; none exist, which is fine.

[newrelic]

# Transaction tracer — captures slow transactions and SQL. Explain plans stay
# off: the agent runs EXPLAIN on fresh DB connections from its harvest thread,
# in all 8 workers, against queries that already take 20-30 s.
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
transaction_tracer.explain_enabled = false

# Error collector. Both lists merge with the agent's defaults.
# 404/405/422: client mistakes, not errors. 400-403/409/429: still counted on
# the transaction but "expected", so they don't page or count toward the error
# rate; a burst of 401/403 (auth failing closed) stays visible in Errors.
error_collector.enabled = true
error_collector.capture_events = true
error_collector.ignore_status_codes = 404 405 422
error_collector.expected_status_codes = 400-403 409 429

# Logs. Forwarding goes through ONE handler that core/newrelic.py attaches with
# a level (PROD WARNING, QA/local INFO; NEW_RELIC_LOG_FORWARD_LEVEL), the
# request_id filter, the warning sampler and a PII-scrubbing formatter. Only
# request_id is kept from the record's extras (as context.request_id).
application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.forwarding.max_samples_stored = 2000
application_logging.forwarding.context_data.enabled = true
application_logging.forwarding.context_data.exclude = *
application_logging.forwarding.context_data.include = request_id
application_logging.metrics.enabled = true
application_logging.local_decorating.enabled = false

# Ingest budget (account is over the free tier): span events per minute per
# worker. Custom events keep the agent default.
span_events.max_samples_stored = 1000

# Distributed tracing
distributed_tracing.enabled = true

# The browser agent is the copy/paste loader in apps/web/public; never inject.
browser_monitoring.auto_instrument = false

# The agent's automatic logging hook (Logger.callHandlers) forwards before
# handler filters run: no level, no sampler, no request_id, no PII scrubbing.
# core/newrelic.py attaches NewRelicLogForwardingHandler instead.
[import-hook:logging]
enabled = false
