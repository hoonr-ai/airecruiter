# AI Recruiter bootstrap config (HTTP only, no certificate required)
#
# Installed by deploy-azure.sh INSTEAD of nginx.conf when no Let's Encrypt
# certificate exists yet for {{DOMAIN_NAME}} - i.e. the first deploy after a
# domain rename. nginx.conf hard-references
# /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem, so installing it before
# the cert exists fails `nginx -t`; nginx then never reloads, and certbot's
# nginx plugin cannot run either because it shells out to `nginx -t` itself.
# That deadlock is what this file breaks: it serves the app over plain HTTP and
# exposes the ACME webroot, so certbot can validate the domain and issue a cert.
# setup-ssl.sh then swaps in the real nginx.conf and reloads.
#
# Template placeholder:
# {{DOMAIN_NAME}} - hostname being brought up

server {
    listen 80 default_server;
    server_name {{DOMAIN_NAME}};

    # Certbot webroot validation target.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Shared application config (security headers, body limits, all locations).
    # Same snippet the HTTPS config includes, so behaviour cannot drift.
    include /etc/nginx/snippets/airecruiter-app.conf;
}
