# Legacy domain 301 redirect — TRANSITION WINDOW ONLY
#
# Installed by deploy-azure.sh as /etc/nginx/sites-available/airecruiter-legacy
# while the legacy hostname is still in DNS, so links and bookmarks pointing at
# the old name keep working instead of dying the moment nginx reloads onto the
# new server_name.
#
# This file is installed only until LEGACY_REDIRECT_UNTIL (see deploy-azure.sh);
# after that date the deploy removes the site and the old name stops answering.
#
# Template placeholders:
# {{LEGACY_DOMAIN}} - old hostname being retired (e.g. qacurate.hoonr.ai)
# {{DOMAIN_NAME}}   - new canonical hostname (e.g. pairqa.pyramidci.com)

server {
    listen 80;
    server_name {{LEGACY_DOMAIN}};

    # Keep the legacy cert renewable while the redirect is live.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://{{DOMAIN_NAME}}$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name {{LEGACY_DOMAIN}};

    ssl_certificate /etc/letsencrypt/live/{{LEGACY_DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{LEGACY_DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://{{DOMAIN_NAME}}$request_uri;
    }
}
