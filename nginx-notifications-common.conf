# Shared by every /api/v1/notifications* location in nginx-app-locations.conf
# (the exact list match, the catch-all for everything else under it, and the
# SSE stream) so the rate-limit zones and proxy target can't drift apart
# between them (PR #870 review). Each location still sets its own
# proxy_read_timeout (long only for the SSE stream) and, for the stream
# only, proxy_buffering/Upgrade/Connection — those genuinely differ per
# location and stay out of this file.
limit_req zone=notifications_session_limit burst=60 nodelay;
limit_req zone=notifications_ip_limit burst=200 nodelay;

proxy_pass http://airecruiter_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_cache_bypass $http_upgrade;
