# AI Recruiter Nginx Configuration Template
# Copy this file to /etc/nginx/sites-available/airecruiter
# 
# Template placeholders:
# {{DOMAIN_NAME}} - Will be replaced with actual domain during deployment
#                   (pairqa.pyramidci.com for QA, pair.pyramidci.com for PROD)

# Shared upstream/rate-limit directives (upstream + limit_req_zone are only
# valid in the http context, so they can't live in nginx-app-locations.conf,
# which is included inside a server block). See nginx-upstreams.conf -
# installed by deploy-azure.sh. Also included by nginx-bootstrap.conf so the
# two configs can never drift apart.
include /etc/nginx/snippets/airecruiter-upstreams.conf;

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name {{DOMAIN_NAME}};

    # Certbot webroot validation must be reachable over plain HTTP, including
    # on renewal. Without this, the redirect below sends the ACME challenge to
    # HTTPS and Let's Encrypt cannot validate the domain.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main server block (HTTPS)
server {
    listen 443 ssl http2;
    server_name {{DOMAIN_NAME}};
    
    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN_NAME}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Shared application config (security headers, body limits, all locations).
    # See nginx-app-locations.conf - installed by deploy-azure.sh.
    include /etc/nginx/snippets/airecruiter-app.conf;
}
